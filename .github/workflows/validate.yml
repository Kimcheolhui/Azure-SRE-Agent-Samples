name: Validate workshop samples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: samples/payment-api/package-lock.json
      - run: npm ci
        working-directory: samples/payment-api
      - run: npm test
        working-directory: samples/payment-api
      - run: node scripts/verify-workshop.mjs
      - run: python3 -m unittest discover -s tools/tests -v
      - run: bash -n scripts/deploy.sh scripts/scenario.sh
